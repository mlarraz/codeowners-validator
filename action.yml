name: "CODEOWNERS Validator"
description: "GitHub action to ensure the correctness of your CODEOWNERS file."
author: "mlarraz@users.noreply.github.com"

inputs:
  github_access_token:
    description: "The GitHub token the owners check uses to read CODEOWNERS errors from the GitHub API. It needs read access to the repository contents. Defaults to the workflow's token."
    required: false
    default: "${{ github.token }}"

  github_app_id:
    description: "GitHub App ID for authentication. When set, the app is used instead of github_access_token. Instruction for creating a GitHub App can be found here: https://github.com/mlarraz/codeowners-validator/blob/main/docs/gh-auth.md"
    required: false

  github_app_installation_id:
    description: "Github App Installation ID. Required when GITHUB_APP_ID is set."
    required: false

  github_app_private_key:
    description: "Github App private key in PEM format. Required when GITHUB_APP_ID is set."
    required: false

  github_base_url:
    description: "The GitHub base URL for API requests. Defaults to the public GitHub API, but can be set to a domain endpoint to use with GitHub Enterprise. Default: https://api.github.com/"
    required: false

  github_upload_url:
    description: "The GitHub upload URL for uploading files. It is taken into account only when the GITHUB_BASE_URL is also set. If only the GITHUB_BASE_URL is provided then this parameter defaults to the GITHUB_BASE_URL value. Default: https://uploads.github.com/"
    required: false

  experimental_checks:
    description: "Removed: notowned and avoid-shadowing are regular checks, list them in checks instead. Setting it fails the action."
    default: ""
    required: false

  checks:
    description: "The comma-separated list of checks to run. Defaults to syntax,duppatterns,files,owners. Possible values: syntax,duppatterns,files,owners,notowned,avoid-shadowing. Add :warning or :info to a check to report its issues at that level at most, for example files:info; info issues never fail the action."
    required: false
    default: ""

  repository_path:
    description: "The repository path in which CODEOWNERS file should be validated."
    required: false
    default: "."

  check_failure_level:
    description: "Defines the level on which the application should treat check issues as failures. Defaults to warning, which treats both errors and warnings as failures, and exits with error code 3. Possible values are error and warning. Default: warning"
    required: false

  baseline_path:
    description: "The path of the baseline file, relative to repository_path. The issues that it lists are reported but don't fail the action; entries that don't match any issue anymore are reported as warnings. Generate it with the baseline command, see docs/gh-action.md. Add it to the sparse checkout."
    required: false
    default: ""

  not_owned_checker_skip_patterns:
    description: "The comma-separated list of patterns that should be ignored by not-owned-checker. For example, you can specify * and as a result, the * pattern from the CODEOWNERS file will be ignored and files owned by this pattern will be reported as unowned unless a later specific pattern will match that path. It's useful because often we have default owners entry at the begging of the CODOEWNERS file, e.g. * @global-owner1 @global-owner2"
    required: false

  owner_checker_repository:
    description: "The owner and repository name whose CODEOWNERS file the owners check validates, for example octo-org/octo-repo."
    required: false
    default: "${{ github.repository }}"

  owner_checker_ref:
    description: "The branch, tag, or commit SHA whose CODEOWNERS file the owners check validates. It must exist on GitHub. Defaults to the commit checked out in repository_path."
    required: false

  owner_checker_ignored_owners:
    description: "The comma-separated list of owners that should not be validated. Example: @owner1,@owner2,@org/team1,example@email.com."
    required: false

  owner_checker_allow_unowned_patterns:
    description: "Specifies whether CODEOWNERS may have unowned files. For example, `/infra/oncall-rotator/oncall-config.yml` doesn't have owner and this is not reported."
    default: "true"
    required: false

  owner_checker_owners_must_be_teams:
    description: "Specifies whether only teams are allowed as owners of files."
    default: "false"
    required: false

  not_owned_checker_subdirectories:
    description: "Only check listed subdirectories for CODEOWNERS ownership that don't have owners."
    required: false

runs:
  using: "composite"
  steps:
    - name: Install codeowners-validator
      shell: bash
      env:
        # The release that the action installs. The release process updates it, see docs/release.md.
        VERSION: "v0.9.1"
        # The GitHub CLI reads the release attestation with the workflow's token, see docs/gh-action.md.
        GH_TOKEN: ${{ github.token }}
      run: |
        # The workflow's token can only read the release attestation on github.com.
        if [ "$GITHUB_SERVER_URL" = "https://github.com" ]; then
          sh "$GITHUB_ACTION_PATH/install.sh" -a -b "$RUNNER_TEMP/codeowners-validator" "$VERSION"
        else
          sh "$GITHUB_ACTION_PATH/install.sh" -b "$RUNNER_TEMP/codeowners-validator" "$VERSION"
        fi

    - name: Validate CODEOWNERS
      shell: bash
      env:
        ENVS_PREFIX: "INPUT"
        INPUT_GITHUB_ACCESS_TOKEN: ${{ inputs.github_access_token }}
        INPUT_GITHUB_APP_ID: ${{ inputs.github_app_id }}
        INPUT_GITHUB_APP_INSTALLATION_ID: ${{ inputs.github_app_installation_id }}
        INPUT_GITHUB_APP_PRIVATE_KEY: ${{ inputs.github_app_private_key }}
        INPUT_GITHUB_BASE_URL: ${{ inputs.github_base_url }}
        INPUT_GITHUB_UPLOAD_URL: ${{ inputs.github_upload_url }}
        INPUT_EXPERIMENTAL_CHECKS: ${{ inputs.experimental_checks }}
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_REPOSITORY_PATH: ${{ inputs.repository_path }}
        INPUT_CHECK_FAILURE_LEVEL: ${{ inputs.check_failure_level }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline_path }}
        INPUT_NOT_OWNED_CHECKER_SKIP_PATTERNS: ${{ inputs.not_owned_checker_skip_patterns }}
        INPUT_OWNER_CHECKER_REPOSITORY: ${{ inputs.owner_checker_repository }}
        INPUT_OWNER_CHECKER_REF: ${{ inputs.owner_checker_ref }}
        INPUT_OWNER_CHECKER_IGNORED_OWNERS: ${{ inputs.owner_checker_ignored_owners }}
        INPUT_OWNER_CHECKER_ALLOW_UNOWNED_PATTERNS: ${{ inputs.owner_checker_allow_unowned_patterns }}
        INPUT_OWNER_CHECKER_OWNERS_MUST_BE_TEAMS: ${{ inputs.owner_checker_owners_must_be_teams }}
        INPUT_NOT_OWNED_CHECKER_SUBDIRECTORIES: ${{ inputs.not_owned_checker_subdirectories }}
      run: '"$RUNNER_TEMP/codeowners-validator/codeowners-validator"'

branding:
  icon: "shield"
  color: "gray-dark"
