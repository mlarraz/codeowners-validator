version: 2

builds:
  - id: codeowners-validator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm64
    ldflags:
      - -s -w -X go.szostok.io/version.version={{.Version}} -X go.szostok.io/version.buildDate={{.Date}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - ids:
      - codeowners-validator
    images:
      - "ghcr.io/mlarraz/codeowners-validator"
    tags:
      - "stable"
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'

dist: bin

release:
  # If set to true, will not auto-publish the release.
  # Default is false.
  draft: true
