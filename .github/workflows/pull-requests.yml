name: Pull request

on:
  pull_request:
    branches: [ main ]

permissions: {}

env:
  GO111MODULE: on
  INSTALL_DEPS: true

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || 'branch' }} # scope to for the current workflow
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # cancel only PR related jobs

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: "Build and unit-test"
        run: make test-unit
      - name: "Hammer unit-test"
        run: make test-hammer
  code-quality-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: "Code Quality Analysis"
        run: make test-lint
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - if: matrix.os == 'windows-latest'
        run: echo "BINARY_EXT=.exe" >> "$GITHUB_ENV"
      - name: "Integration testing"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: make test-integration
  action-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-slim, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate a valid CODEOWNERS file
        uses: ./
        with:
          checks: "syntax,duppatterns,files"
          repository_path: tests/integration/testdata/repos/gh-codeowners/happy-path
      - name: Validate an invalid CODEOWNERS file
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          checks: "syntax,duppatterns,files"
          repository_path: tests/integration/testdata/repos/gh-codeowners/failures
      - name: Expect the invalid CODEOWNERS file to fail
        if: steps.invalid.outcome != 'failure'
        run: |
          echo "::error::The action passed on an invalid CODEOWNERS file"
          exit 1
